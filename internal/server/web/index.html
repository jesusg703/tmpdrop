<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tmpdrop — temporary file sharing</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23D8B063'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="site-head">
    <p class="kicker">Temporary file sharing</p>
    <h1>tmpdrop</h1>
    <p class="tagline">Upload a file, share the link, it&rsquo;s gone when the timer runs out.</p>
  </header>

  <main>
    <section class="panel" aria-label="Upload a file">
      <form id="upload-form">
        <div class="dropzone" id="dropzone">
          <p id="drop-hint"><strong>Choose a file</strong> or drag it here</p>
          <p id="selected-file" class="selected hidden"></p>
          <input type="file" id="file" name="file" required>
        </div>
        <div class="row">
          <label>
            <span>Expiration</span>
            <select name="ttl" id="ttl">
              <option value="">Server default</option>
              <option value="1h">1 hour</option>
              <option value="24h" selected>1 day</option>
              <option value="72h">3 days</option>
              <option value="168h">7 days</option>
              <option value="never">∞</option>
            </select>
          </label>
          <label>
            <span>Downloads</span>
            <input type="number" id="max-downloads" name="max_downloads" min="0" placeholder="∞" title="Leave empty for unlimited downloads">
          </label>
          <label class="grow">
            <span>Password</span>
            <input type="password" id="password" name="password" maxlength="128" placeholder="optional">
          </label>
        </div>
        <button type="submit" class="btn primary" id="upload-btn">Upload</button>
        <div id="progress" class="progress hidden"><div id="progress-bar"></div></div>
      </form>
      <div class="share hidden" id="share">
        <span class="head">Share link</span>
        <input type="text" id="share-link" readonly aria-label="Share link">
        <button type="button" class="btn" id="share-copy">Copy</button>
      </div>
      <p class="usage" id="usage"></p>
    </section>

    <section class="panel" aria-label="Shared files">
      <div class="panel-head">
        <h2>Files</h2>
      </div>
      <div id="file-list"></div>
      <p class="empty" id="empty">No files yet. Share something above.</p>
    </section>
  </main>

  <footer class="site-foot">
    <p>tmpdrop — files are stored locally and removed automatically.</p>
    <p>AGPL-3.0. <a href="__SOURCE_URL__" rel="noopener">Source code</a>.</p>
  </footer>

  <div class="modal-backdrop hidden" id="password-modal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pw-title">
      <h3 id="pw-title">Password required</h3>
      <p class="muted" id="pw-file-name"></p>
      <label>
        <span>Password</span>
        <input type="password" id="pw-input" autocomplete="off">
      </label>
      <div class="modal-actions">
        <button type="button" class="btn" id="pw-cancel">Cancel</button>
        <button type="button" class="btn primary" id="pw-ok">Unlock</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="/assets/app.js" defer></script>
</body>
</html>
